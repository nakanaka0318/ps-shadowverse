<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>シャドバPS チーム分析</title>
<meta name="description" content="Shadowverse Premier Series 26-27 各チームのバトル枠別勝率、クラス別成績、直接対決、所属選手。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232a78d6'/%3E%3Ctext x='16' y='21' font-size='13' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='700'%3EPS%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/style.css">
<script src="assets/ps-data.js"></script>

</head>
<body data-page="teams">
<main>
  <div class="page-head">
    <div class="eyebrow">Teams</div>
    <h1>チーム分析</h1>
    <p>8チームの勝ち方を比べます。選手戦（B1〜3）とチーム戦（B4・5）、先攻と後攻、5バトル目までもつれた試合での強さ。チームを選ぶと、順位推移、クラス別成績、直接対決、所属選手の成績を表示します。</p>
  </div>
  <section>
    <div class="section-title"><h2>全チーム比較</h2><span class="muted">見出しをクリックで並べ替え／セルにカーソルで勝敗数</span></div>
    <div class="card" id="overview"></div>
  </section>
  <section>
    <div class="section-title"><h2>チーム詳細</h2></div>
    <div class="controls" id="team-chips" role="group" aria-label="チームを選択"></div>
    <div id="team-panel"></div>
  </section>
</main>
</body>
</html>
